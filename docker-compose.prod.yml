# Production. API на host-network → host MySQL (127.0.0.1).
# nginx проксирует на 127.0.0.1:3000.
# MySQL/Redis контейнеры остаются в стеке (legacy CI), API их DNS не использует.
# Не использовать: docker compose down -v
name: runbonus

services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: runbonus-api:${IMAGE_TAG:-latest}
    container_name: runbonus-api
    restart: unless-stopped
    network_mode: host
    env_file:
      - /opt/runbonus/backend/.env
    environment:
      NODE_ENV: production
      PORT: "3000"
      TZ: Asia/Dushanbe
      JOBS: "true"
      UPLOADS_ROOT: /app/uploads
      DB_HOST: 127.0.0.1
    volumes:
      - api_uploads:/app/uploads
      - ./backend/secrets:/app/secrets:ro
      - ./database:/app/database:ro
    security_opt:
      - no-new-privileges:true

  mysql:
    image: mariadb:11.4
    container_name: runbonus-mysql
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    container_name: runbonus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"

volumes:
  mysql_data:
  redis_data:
  api_uploads:
