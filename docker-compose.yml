# Локальный / базовый стек. Данные в named volumes — `docker compose down` их не удаляет.
# Запрещено в production: docker compose down -v

name: runbonus

services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: runbonus-api:${IMAGE_TAG:-git-local}
    container_name: runbonus-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: "3000"
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_USER: ${MYSQL_USER:-runbonus}
      DB_PASSWORD: ${MYSQL_PASSWORD:-runbonus}
      DB_NAME: ${MYSQL_DATABASE:-runbonus}
      REDIS_URL: redis://redis:6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    expose:
      - "3000"
    volumes:
      - api_uploads:/app/uploads

  mysql:
    image: mariadb:11.4
    container_name: runbonus-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-runbonus}
      MYSQL_USER: ${MYSQL_USER:-runbonus}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-runbonus}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-runbonus-root}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    expose:
      - "3306"

  redis:
    image: redis:7-alpine
    container_name: runbonus-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    expose:
      - "6379"

  nginx:
    image: nginx:alpine
    container_name: runbonus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.staging.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - api

volumes:
  mysql_data:
  redis_data:
  api_uploads:
