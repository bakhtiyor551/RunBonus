# Go API рядом с текущим Node (PM2) и MySQL на том же сервере.
# network_mode: host — контейнер видит MySQL и Node на 127.0.0.1, слушает :8080.
services:
  api-go:
    image: ${IMAGE:-runbonus/api-go}:${TAG:-latest}
    build: .
    restart: unless-stopped
    network_mode: host
    env_file: ../backend/.env
    environment:
      GO_PORT: "8080"
      NODE_UPSTREAM: ${NODE_UPSTREAM:-http://127.0.0.1:3001}
      # Модули, которые обслуживает Go (остальное уходит в Node). all — все перенесённые.
      GO_MODULES: ${GO_MODULES:-all}
      # Автозакрытие тренировок: включайте только после отключения его в Node.
      GO_JOBS: ${GO_JOBS:-false}
      TZ: ${TZ:-Asia/Dushanbe}
      UPLOADS_ROOT: /data/uploads
      BACKEND_DIR: /app
    volumes:
      - ../backend/uploads:/data/uploads
      - ../backend/secrets:/app/secrets:ro
