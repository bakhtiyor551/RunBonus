name: runbonus
description: "RunBonus — мобильное приложение (iOS / Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  web_socket_channel: ^3.0.3
  shared_preferences: ^2.5.6
  path_provider: ^2.1.6
  path: ^1.9.1
  sqflite: ^2.4.5
  uuid: ^4.6.0
  intl: ^0.20.3
  geolocator: ^14.0.1
  permission_handler: ^13.0.2
  connectivity_plus: ^7.3.2
  go_router: ^18.1.2
  provider: ^6.1.5+1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  google_mobile_ads: ^9.2.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  image_picker: ^1.2.4
  url_launcher: ^6.3.3
  google_fonts: ^9.0.0
  cached_network_image: ^4.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#131313"
  adaptive_icon_foreground: assets/icon.png
